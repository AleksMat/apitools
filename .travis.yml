language: python
matrix:
  include:
  - python: "3.11"
    env: TOX_ENV=lint
  - python: "3.11"
    env: TOX_ENV=py311-oauth2client1
  - python: "3.11"
    env: TOX_ENV=py311-oauth2client2
  - python: "3.11"
    env: TOX_ENV=py311-oauth2client3
  - python: "3.11"
    env: TOX_ENV=py311-oauth2client4
install:
  - pip install tox
  - pip install .
script: tox -e $TOX_ENV
after_success:
  - if [[ "${TOX_ENV}" == "py311-oauth2client4" ]]; then tox -e coveralls; fi
